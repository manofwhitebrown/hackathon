<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plain Terms: Page not found</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('plain-terms-theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (err) {}
  })();
</script>
<style>
  .not-found { max-width: 480px; margin: 4rem auto; padding: 0 1.5rem; text-align: center; }
  .not-found h1 { font-family: var(--serif); font-size: 2.2rem; margin: 0 0 0.5rem; }
  .not-found p { color: var(--ink-soft); margin: 0 0 1.5rem; }
</style>
</head>
<body>
  <main class="not-found">
    <h1>Page not found</h1>
    <p>That link doesn't lead anywhere. The document decoder is still right where it should be.</p>
    <a href="index.html" class="primary-button">Back to Plain Terms</a>
  </main>
</body>
</html>
